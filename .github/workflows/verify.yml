name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test, package and check Java formatting
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$HOME/.m2/repository" clean verify spotless:check
      - name: Validate both Compose profiles with synthetic configuration
        env:
          STOCKPILOT_ENV_FILE: .env.example
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile app config --quiet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  integration:
    name: MySQL and RabbitMQ integration
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ci_it_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_it_password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: stockpilot
          RABBITMQ_DEFAULT_PASS: ci_it_password
          RABBITMQ_DEFAULT_VHOST: /stockpilot-it
        ports:
          - 5673:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      STOCKPILOT_IT_ADMIN_URL: jdbc:mysql://127.0.0.1:3307/?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      STOCKPILOT_IT_ADMIN_USER: root
      STOCKPILOT_IT_ADMIN_PASSWORD: ci_it_password
      STOCKPILOT_IT_RABBIT_HOST: 127.0.0.1
      STOCKPILOT_IT_RABBIT_PORT: '5673'
      STOCKPILOT_IT_RABBIT_USER: stockpilot
      STOCKPILOT_IT_RABBIT_PASSWORD: ci_it_password
      STOCKPILOT_IT_RABBIT_VHOST: /stockpilot-it
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: MySQL transactions, concurrency and authenticated HTTP
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$HOME/.m2/repository" -Pmysql-it verify
      - name: Preserve MySQL reports before the broker suite
        if: always()
        run: |
          if [ -d target/failsafe-reports ]; then
            cp -R target/failsafe-reports target/mysql-it-reports
          fi
      - name: Real broker confirms, retries, idempotency and dead letters
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local="$HOME/.m2/repository" -Prabbit-it verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-test-reports
          path: |
            target/mysql-it-reports/
            target/failsafe-reports/
            target/surefire-reports/
          retention-days: 7
