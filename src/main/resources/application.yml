server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stockpilot-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/stockpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:stockpilot}
    password: ${DB_PASSWORD:stockpilot_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0.1.0
    baseline-description: existing skeleton schema

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.stockpilot: INFO

stockpilot:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
