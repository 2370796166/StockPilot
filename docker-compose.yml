services:
  mysql:
    image: mysql:8.0
    container_name: stockpilot-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: stockpilot
      MYSQL_USER: stockpilot
      MYSQL_PASSWORD: stockpilot_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - stockpilot_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

volumes:
  stockpilot_mysql_data:
